<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>严正声明</title>
    <style>
        /* 清除默认边距，设置背景色为白色 */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            height: 100vh; /* 高度占满视口 */
            display: flex; /* 使用弹性布局 */
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */
            overflow: hidden; /* 防止出现滚动条 */
        }

        /* 文字容器样式 */
        .container {
            text-align: center; /* 文字居中 */
            padding: 20px;
            /* 使用 clamp 函数实现响应式字体：
               最小 2rem，首选屏幕宽度的 4%，最大 5rem。
               这样无论是在手机还是电脑大屏上，字都会很大且尽量占满屏幕。 */
            font-size: clamp(2rem, 4vw, 5rem);
            font-family: "Microsoft YaHei", sans-serif; /* 使用无衬线字体，更清晰 */
            font-weight: 900; /* 字体加粗，更有力量感 */
            line-height: 1.5; /* 行高，防止文字挤在一起 */
        }

        /* 红色文字样式 */
        .highlight {
            color: red;
        }

        /* 黑色文字样式（默认即为黑色，这里为了明确写出来） */
        .normal {
            color: black;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="normal">2班原创网站已被3A01</span><span class="highlight">胡天洛</span><span class="normal">盗取代码，强烈谴责！</span>
    </div>

</body>
</html>
